[project]
name = "realitycheck-server"
version = "0.2.0"
description = "RealityCheck backend - AI voice sales manager"
requires-python = ">=3.11"
dependencies = [
    "assemblyai>=0.60,<1.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]